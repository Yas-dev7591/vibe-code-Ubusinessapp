openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ubusiness — Global Market Intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Market analysis operations
  - name: anthropic
    description: Anthropic AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /market/analyze:
    post:
      operationId: analyzeMarket
      tags: [market]
      summary: Analyze market opportunity for a region and niche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAnalysisInput"
      responses:
        "200":
          description: SSE stream of analysis chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /market/history:
    get:
      operationId: listAnalysisHistory
      tags: [market]
      summary: List past market analyses
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketAnalysis"

  /market/history/{id}:
    get:
      operationId: getAnalysis
      tags: [market]
      summary: Get a specific analysis result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAnalysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnalysis
      tags: [market]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /market/regions:
    get:
      operationId: listRegions
      tags: [market]
      summary: List supported regions with macro data summaries
      responses:
        "200":
          description: Regions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /market/niches:
    get:
      operationId: listNiches
      tags: [market]
      summary: List popular business niches
      responses:
        "200":
          description: Niches list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Niche"

  /market/stats:
    get:
      operationId: getMarketStats
      tags: [market]
      summary: Get dashboard stats (total analyses, top regions, top niches)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStats"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MarketAnalysisInput:
      type: object
      properties:
        region:
          type: string
        niche:
          type: string
      required:
        - region
        - niche

    MarketAnalysis:
      type: object
      properties:
        id:
          type: integer
        region:
          type: string
        niche:
          type: string
        verdict:
          type: string
        opportunityScore:
          type: integer
        riskScore:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - region
        - niche
        - verdict
        - opportunityScore
        - riskScore
        - createdAt

    Region:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        continent:
          type: string
        cpiIndex:
          type: number
        gdpGrowth:
          type: number
        regulatoryBody:
          type: string
        easeOfDoingBusiness:
          type: number
      required:
        - code
        - name
        - continent
        - cpiIndex
        - gdpGrowth
        - regulatoryBody
        - easeOfDoingBusiness

    Niche:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        globalTrend:
          type: string
      required:
        - id
        - name
        - category
        - globalTrend

    MarketStats:
      type: object
      properties:
        totalAnalyses:
          type: integer
        topRegions:
          type: array
          items:
            type: string
        topNiches:
          type: array
          items:
            type: string
        avgOpportunityScore:
          type: number
      required:
        - totalAnalyses
        - topRegions
        - topNiches
        - avgOpportunityScore

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
